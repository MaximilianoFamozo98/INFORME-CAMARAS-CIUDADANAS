<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Mapa Cámaras</title>

    <link rel="stylesheet" href="/maplibre/maplibre-gl.css" />

    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        font-family:
          Segoe UI,
          Arial,
          sans-serif;
      }

      #map {
        width: 100%;
        height: 100%;
      }

      /* =============================
       PANEL
    ============================= */

      #panel {
        position: absolute;
        top: 20px;
        left: 20px;
        width: 330px;
        max-height: calc(100vh - 40px);
        overflow: auto;
        z-index: 10;

        background: rgba(15, 23, 42, 0.96);
        color: white;

        border-radius: 16px;
        padding: 14px;

        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.35);
      }

      .panel-titulo {
        font-size: 18px;
        font-weight: 900;
        margin-bottom: 12px;
      }

      .stats {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 12px;
      }

      .stat {
        background: #111827;
        padding: 10px;
        border-radius: 10px;
      }

      .stat small {
        color: #94a3b8;
      }

      .stat-numero {
        font-size: 22px;
        font-weight: 900;
      }

      #online {
        color: #22c55e;
      }

      #caidas {
        color: #ef4444;
      }

      #sincoord {
        color: #94a3b8;
      }

      #buscar,
      #filtroEstado {
        width: 100%;
        padding: 10px;

        margin-bottom: 8px;

        border: none;
        border-radius: 9px;
        outline: none;

        background: #0b1220;
        color: white;
      }

      #listaCamaras {
        margin-top: 6px;
      }

      .cam-item {
        padding: 9px;
        margin-bottom: 6px;

        background: #0b1220;

        border-radius: 9px;

        cursor: pointer;

        font-size: 13px;

        transition: 0.15s;
      }

      .cam-item:hover {
        background: #17233b;
        transform: translateX(3px);
      }

      .cam-ubicacion {
        color: #94a3b8;
        margin-top: 3px;
      }

      .cam-estado {
        margin-top: 5px;
        font-weight: 800;
      }
    </style>
  </head>

  <body>
    <!-- =============================
       PANEL
  ============================= -->

    <div id="panel">
      <div
        style="
          display: flex;
          align-items: center;
          justify-content: space-between;
          margin-bottom: 12px;
        "
      >
        <div class="panel-titulo" style="margin-bottom: 0">📍 Cámaras</div>

        <button
          id="btnCerrarPanel"
          style="
            width: 34px;
            height: 34px;
            border: none;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            font-weight: 900;
            cursor: pointer;
          "
        >
          ✕
        </button>
      </div>

      <div class="stats">
        <div class="stat">
          <small>Total</small>
          <div id="total" class="stat-numero">0</div>
        </div>

        <div class="stat">
          <small>Online</small>
          <div id="online" class="stat-numero">0</div>
        </div>

        <div class="stat">
          <small>Caídas</small>
          <div id="caidas" class="stat-numero">0</div>
        </div>

        <div class="stat">
          <small>Sin Coord</small>
          <div id="sincoord" class="stat-numero">0</div>
        </div>
      </div>

      <input id="buscar" placeholder="Buscar cámara o calle..." />

      <select id="filtroEstado">
        <option value="TODAS">Todas</option>

        <option value="ONLINE">Online</option>

        <option value="CAIDA">Caídas</option>
      </select>
<button
        id="btnActualizar"
        style="
          width: 100%;
          padding: 10px;
          margin-bottom: 10px;
          border: none;
          border-radius: 9px;
          background: #2563eb;
          color: white;
          font-weight: 800;
          cursor: pointer;
        "
      >
        🔄 Actualizar ahora
      </button>

      <button
        id="btnFullscreen"
        style="
          width: 100%;
          padding: 10px;
          margin-bottom: 10px;
          border: none;
          border-radius: 9px;
          background: #2563eb;
          color: white;
          font-weight: 800;
          cursor: pointer;
        "
      >
        🖥 Fullscreen
      </button>

      <details id="panelCoordenadas" style="margin-bottom:10px;background:#111827;border-radius:10px;padding:10px">
        <summary style="cursor:pointer;font-weight:900;user-select:none">
          ⚙️ Coordenadas
          <span id="contadorPendientes" style="margin-left:6px;color:#f59e0b"></span>
        </summary>
        <div style="margin-top:12px">
          <select id="camaraEdit" style="width:100%;padding:10px;margin-bottom:8px;border:none;border-radius:9px;background:#0b1220;color:white;outline:none"></select>
          <button id="btnReubicar" style="width:100%;padding:10px;margin-bottom:8px;border:none;border-radius:9px;background:#2563eb;color:white;font-weight:800;cursor:pointer">
            📌 Ubicar / Reubicar cámara
          </button>
          <button id="btnEliminarCoord" style="width:100%;padding:10px;border:none;border-radius:9px;background:#991b1b;color:white;font-weight:800;cursor:pointer">
            🗑 Eliminar coordenada
          </button>
        </div>
      </details>

      <div id="listaCamaras"></div>
    </div>

    <div
      id="estadoEscaneoMapa"
      style="
        display: none;
        position: absolute;
        top: 14px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 20;
        width: 420px;
        max-width: 90%;
        background: rgba(11, 18, 32, 0.95);
        padding: 12px 14px;
        border-radius: 12px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(6px);
      "
    >
      <div
        id="textoEscaneoMapa"
        style="font-weight: 800; margin-bottom: 8px; color: white"
      >
        🔄 Autoescaneo en curso...
      </div>

      <div
        style="
          width: 100%;
          height: 12px;
          background: #1e293b;
          border-radius: 999px;
          overflow: hidden;
        "
      >
        <div
          id="barraEscaneoMapa"
          style="
            width: 0%;
            height: 100%;
            background: #2563eb;
            transition: width 0.3s;
          "
        ></div>
      </div>

      <div
        id="detalleEscaneoMapa"
        style="margin-top: 7px; font-size: 12px; color: #94a3b8"
      ></div>
    </div>

    <!-- =============================
       MAPA
  ============================= -->
    <button
      id="btnAbrirPanel"
      style="
        position: absolute;
        top: 20px;
        left: 12px;
        z-index: 11;
        width: 42px;
        height: 52px;
        border: none;
        border-radius: 0 12px 12px 0;
        background: #2563eb;
        color: white;
        font-size: 20px;
        font-weight: 900;
        cursor: pointer;
        display: none;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
      "
    >
      ☰
    </button>
    <div id="map"></div>

    <script type="module">
      import * as maplibregl from "/maplibre/maplibre-gl.mjs";

      /* ============================================================
       ELEMENTOS HTML
    ============================================================ */
      const totalEl = document.getElementById("total");
      const onlineEl = document.getElementById("online");
      const caidasEl = document.getElementById("caidas");
      const sincoordEl = document.getElementById("sincoord");
      const buscarInput = document.getElementById("buscar");
      const filtroEstadoSelect = document.getElementById("filtroEstado");
      const listaCamarasEl = document.getElementById("listaCamaras");
      const camaraEditSelect = document.getElementById("camaraEdit");
      const btnReubicar = document.getElementById("btnReubicar");
      const btnEliminarCoord = document.getElementById("btnEliminarCoord");
      const contadorPendientes = document.getElementById("contadorPendientes");
      /* ============================================================
       VARIABLES GLOBALES
    ============================================================ */
      let camarasGeoJSON = null;
      let historialData = null;
      let totalCamaras = 0;
      let sinCoordCount = 0;
      let modoEdicion = false;
      let coordsData = [];
      /* ============================================================
       MAPA
    ============================================================ */

      const map = new maplibregl.Map({
        container: "map",

        center: [-58.276, -34.806],

        zoom: 12,

        style: {
          version: 8,

          /* =============================
           FUENTE MAPA OFFLINE
        ============================= */

          sources: {
            osm: {
              type: "vector",

              tiles: ["/tiles/{z}/{x}/{y}.pbf"],

              minzoom: 0,

              maxzoom: 14,
            },
          },

          /* =============================
           CAPAS MAPA
        ============================= */

          layers: [
            /* =============================
             FONDO
          ============================= */

            {
              id: "background",

              type: "background",

              paint: {
                "background-color": "#f2efe9",
              },
            },

            /* =============================
             USO DEL SUELO
          ============================= */

            {
              id: "landuse",

              type: "fill",

              source: "osm",

              "source-layer": "landuse",

              paint: {
                "fill-color": "#e7e3db",

                "fill-opacity": 0.55,
              },
            },

            /* =============================
             PARQUES
          ============================= */

            {
              id: "parks",

              type: "fill",

              source: "osm",

              "source-layer": "park",

              paint: {
                "fill-color": "#cfe8c8",

                "fill-opacity": 0.9,
              },
            },

            /* =============================
             AGUA
          ============================= */

            {
              id: "water",

              type: "fill",

              source: "osm",

              "source-layer": "water",

              paint: {
                "fill-color": "#a9d6e5",

                "fill-opacity": 1,
              },
            },

            /* =============================
             EDIFICIOS
          ============================= */

            {
              id: "buildings",

              type: "fill",

              source: "osm",

              "source-layer": "building",

              minzoom: 14,

              paint: {
                "fill-color": "#d6d3cf",

                "fill-outline-color": "#bbb7b1",

                "fill-opacity": 0.9,
              },
            },

            /* =============================
             CALLES SECUNDARIAS
          ============================= */

            {
              id: "roads-minor",

              type: "line",

              source: "osm",

              "source-layer": "transportation",

              filter: [
                "match",

                ["get", "class"],

                ["minor", "service", "path", "track"],

                true,

                false,
              ],

              paint: {
                "line-color": "#ffffff",

                "line-width": [
                  "interpolate",

                  ["linear"],

                  ["zoom"],

                  12,
                  0.8,

                  14,
                  1.4,

                  16,
                  2.5,
                ],
              },
            },

            /* =============================
             CALLES PRINCIPALES
          ============================= */

            {
              id: "roads-main",

              type: "line",

              source: "osm",

              "source-layer": "transportation",

              filter: [
                "match",

                ["get", "class"],

                ["primary", "secondary", "tertiary", "trunk"],

                true,

                false,
              ],

              paint: {
                "line-color": "#f6d18a",

                "line-width": [
                  "interpolate",

                  ["linear"],

                  ["zoom"],

                  10,
                  1.2,

                  12,
                  2.2,

                  14,
                  4,

                  16,
                  6,
                ],
              },
            },

            /* =============================
             AUTOPISTAS
          ============================= */

            {
              id: "motorways",

              type: "line",

              source: "osm",

              "source-layer": "transportation",

              filter: ["==", ["get", "class"], "motorway"],

              paint: {
                "line-color": "#f2a65a",

                "line-width": [
                  "interpolate",

                  ["linear"],

                  ["zoom"],

                  10,
                  2,

                  12,
                  3.5,

                  14,
                  6,

                  16,
                  8,
                ],
              },
            },

            /* =============================
             LIMITES
          ============================= */

            {
              id: "boundaries",

              type: "line",

              source: "osm",

              "source-layer": "boundary",

              paint: {
                "line-color": "#8a8a8a",

                "line-width": 1,

                "line-dasharray": [3, 3],

                "line-opacity": 0.6,
              },
            },

            /* =============================
             NOMBRES DE CALLES
          ============================= */

            {
              id: "road-labels",

              type: "symbol",

              source: "osm",

              "source-layer": "transportation_name",

              minzoom: 13,

              layout: {
                "symbol-placement": "line",

                "text-field": ["coalesce", ["get", "name:es"], ["get", "name"]],

                "text-font": ["Arial"],

                "text-size": [
                  "interpolate",

                  ["linear"],

                  ["zoom"],

                  13,
                  10,

                  15,
                  12,

                  18,
                  15,
                ],

                "text-padding": 4,
              },

              paint: {
                "text-color": "#4b5563",

                "text-halo-color": "#ffffff",

                "text-halo-width": 1.5,
              },
            },

            /* =============================
             LOCALIDADES
          ============================= */

            {
              id: "place-labels",

              type: "symbol",

              source: "osm",

              "source-layer": "place",

              layout: {
                "text-field": ["coalesce", ["get", "name:es"], ["get", "name"]],

                "text-font": ["Arial"],

                "text-size": [
                  "interpolate",

                  ["linear"],

                  ["zoom"],

                  10,
                  12,

                  14,
                  17,
                ],

                "text-padding": 8,
              },

              paint: {
                "text-color": "#374151",

                "text-halo-color": "#ffffff",

                "text-halo-width": 2,
              },
            },
          ],
        },
      });

      window.mapMapLibre = map;

      map.addControl(
        new maplibregl.NavigationControl(),

        "bottom-right",
      );

      /* ============================================================
       NORMALIZAR NOMBRE
    ============================================================ */

      function normalizarNombre(txt) {
        txt = (txt || "").toUpperCase();

        txt = txt

          .normalize("NFD")

          .replace(/[\u0300-\u036f]/g, "")

          .replace(/\(DOMO\)/gi, " DOMO ")

          .replace(/\(FIJA\)/gi, " FIJA ")

          .replace(/\(.*?\)/g, " ")

          .replace(/([A-Z])(\d)/g, "$1 $2")

          .replace(/(\d)([A-Z])/g, "$1 $2")

          .replace(/[-_/]/g, " ")

          .replace(/\./g, " ")

          .replace(/\s+/g, " ")

          .trim();

        /* DJO */

        txt = txt.replace(/^DJ\s*O\s*(\d)$/, "DJO 0$1");

        txt = txt.replace(/^DJO\s*O\s*(\d)$/, "DJO 0$1");

        txt = txt.replace(/^DJ\s*(\d)$/, "DJO 0$1");

        txt = txt.replace(/^DJO\s*(\d)$/, "DJO 0$1");

        /* DORI */

        txt = txt.replace(/^DORI\s+(\d{1,2})$/, "DORIO $1");

        /* COMPLETAR CERO */

        txt = txt.replace(/\b([A-Z]{2,10})\s(\d)\b/g, "$1 0$2");

        return txt.trim();
      }

      //LOGICA AUTOESCANEO
      let estabaEscaneandoMapa = false;

      async function revisarAutoEscaneoMapa() {
        try {
          const res = await fetch("/progreso");
          const p = await res.json();

          const contenedor = document.getElementById("estadoEscaneoMapa");

          const barra = document.getElementById("barraEscaneoMapa");

          const texto = document.getElementById("textoEscaneoMapa");

          const detalle = document.getElementById("detalleEscaneoMapa");

          if (p.escaneoEnCurso) {
            estabaEscaneandoMapa = true;

            contenedor.style.display = "block";

            const total = Number(p.total || 0);

            const procesadas = Number(p.procesadas || 0);

            let porcentaje = 0;

            if (total > 0) {
              porcentaje = Math.round((procesadas / total) * 100);
            }

            barra.style.width = porcentaje + "%";

            texto.innerText = `🔄 Autoescaneo en curso... ${porcentaje}%`;

            detalle.innerText = `Procesadas: ${procesadas} / ${total}`;
          } else {
            if (estabaEscaneandoMapa) {
              contenedor.style.display = "block";

              texto.innerText = "✅ Autoescaneo finalizado";

              barra.style.width = "100%";

              detalle.innerText = "Estados actualizados";

              setTimeout(() => {
                contenedor.style.display = "none";

                barra.style.width = "0%";
              }, 5000);

              estabaEscaneandoMapa = false;
            } else {
              contenedor.style.display = "none";
            }
          }
        } catch (err) {
          console.error("Error consultando autoescaneo:", err);
        }
      }

      setInterval(revisarAutoEscaneoMapa, 1000);

      revisarAutoEscaneoMapa();
      /* ============================================================
       EXTRAER CODIGO
    ============================================================ */

      function extraerCodigo(txt) {
        txt = normalizarNombre(txt);

        /* CAR 03 F1 => CAR 03 */

        txt = txt.replace(/\sF\d$/, "");

        /* DORIO => DORI */

        txt = txt.replace(/^DORIO\s(\d{2})$/, "DORI $1");

        txt = txt.replace(/^([A-Z]{2,10})(\d{2,3})$/, "$1 $2");

        /* KM */

        const km = txt.match(/^KM\s?(\d{2})/);

        if (km) {
          return `KM ${km[1]}`;
        }

        const m = txt.match(/[A-Z]{2,10}\s\d{2,3}/);

        return m ? m[0] : txt;
      }

      /* ============================================================
       ESTADO ONLINE
    ============================================================ */

      function estaOnline(estado) {
        return (estado || "").includes("ONLINE");
      }

      /* ============================================================
       CARGAR CAMARAS
    ============================================================ */

      async function cargarCamaras() {
        const [estadoActual, coords, historial] = await Promise.all([
          fetch("/estado-actual").then((r) => r.json()),

          fetch("/api/coords").then((r) => r.json()),

          fetch("/historial").then((r) => r.json()),
        ]);

        historialData = historial;

        coordsData = coords;
        totalCamaras = coords.length;

        /* =============================
         MAPA ESTADOS
      ============================= */

        const mapaEstado = {};

        estadoActual.forEach((cam) => {
          const clave = extraerCodigo(cam.nombre);

          mapaEstado[clave] = cam;
        });

        /* =============================
         FEATURES
      ============================= */

        const features = [];

        coords.forEach((c) => {
          const lat = parseFloat(c.lat);

          const lng = parseFloat(c.lng);

          if (isNaN(lat) || isNaN(lng) || lat === 0 || lng === 0) {
            return;
          }

          const clave = extraerCodigo(c.nombre);

          const datosEstado = mapaEstado[clave];

          const estado = datosEstado?.estado || "SIN RESPUESTA";

          const historialCam = historial.camaras?.[normalizarNombre(c.nombre)];

          features.push({
            type: "Feature",

            geometry: {
              type: "Point",

              coordinates: [lng, lat],
            },

            properties: {
              nombre: c.nombre,

              estado: estado,

              latencia: datosEstado?.latencia || "-",

              fecha: datosEstado?.fecha || "",

              proveedor: historialCam?.info?.proveedor || "-",

              ubicacion: historialCam?.info?.ubicacion || "-",

              ip: historialCam?.info?.ip || "-",

              historial: JSON.stringify(historialCam?.estados || {}),
            },
          });
        });

        /* =============================
         GEOJSON
      ============================= */

        camarasGeoJSON = {
          type: "FeatureCollection",
          features,
        };

        camaraEditSelect.innerHTML = "";
        let pendientes = 0;

        [...coords]
          .sort((a, b) => {
            const latA = parseFloat(a.lat);
            const lngA = parseFloat(a.lng);
            const latB = parseFloat(b.lat);
            const lngB = parseFloat(b.lng);

            const aTieneCoord =
              !isNaN(latA) && !isNaN(lngA) && latA !== 0 && lngA !== 0;

            const bTieneCoord =
              !isNaN(latB) && !isNaN(lngB) && latB !== 0 && lngB !== 0;

            // Primero las cámaras SIN coordenadas
            if (aTieneCoord !== bTieneCoord) {
              return aTieneCoord ? 1 : -1;
            }

            // Dentro de cada grupo, ordenar por nombre
            return a.nombre.localeCompare(b.nombre, "es", {
              numeric: true,
              sensitivity: "base",
            });
          })
          .forEach((camara) => {
            const lat = parseFloat(camara.lat);
            const lng = parseFloat(camara.lng);
            const tieneCoord = !isNaN(lat) && !isNaN(lng) && lat !== 0 && lng !== 0;

            const option = document.createElement("option");
            option.value = camara.nombre;
            option.textContent = tieneCoord
              ? camara.nombre
              : `⚠ ${camara.nombre} — SIN COORDENADAS`;

            camaraEditSelect.appendChild(option);
            if (!tieneCoord) pendientes++;
          });

        sinCoordCount = pendientes;
        contadorPendientes.innerText =
          pendientes > 0 ? `(${pendientes} pendientes)` : "(sin pendientes)";

        console.log("📍 Cámaras cargadas:", features.length);

        /* =============================
         SOURCE
      ============================= */

        map.addSource("camaras", {
          type: "geojson",

          data: camarasGeoJSON,
        });

        /* =============================
         CAPA CAMARAS
      ============================= */

        map.addLayer({
          id: "camaras-puntos",

          type: "circle",

          source: "camaras",

          paint: {
            "circle-radius": [
              "interpolate",

              ["linear"],

              ["zoom"],

              10,
              4,

              12,
              5,

              15,
              7,

              18,
              9,
            ],

            /*
           ONLINE y ONLINE (HTTP)
           verdes.
           El resto rojo.
          */

            "circle-color": [
              "case",

              [
                "match",

                ["get", "estado"],

                ["ONLINE", "ONLINE (HTTP)"],

                true,

                false,
              ],

              "#22c55e",

              "#ef4444",
            ],

            "circle-stroke-color": "#ffffff",

            "circle-stroke-width": 2,
          },
        });

        /* =============================
         PANEL
      ============================= */

        actualizarPanel();
      }

      /* ============================================================
       ACTUALIZAR PANEL
    ============================================================ */

      function actualizarPanel() {
        if (!camarasGeoJSON) {
          return;
        }

        const todas = camarasGeoJSON.features;

        let onlineCount = 0;

        let caidasCount = 0;

        todas.forEach((f) => {
          if (estaOnline(f.properties.estado)) {
            onlineCount++;
          } else {
            caidasCount++;
          }
        });

        /*
       Total incluye las cámaras
       sin coordenadas.
      */

        totalEl.innerText = totalCamaras;

        onlineEl.innerText = onlineCount;

        caidasEl.innerText = caidasCount;

        sincoordEl.innerText = sinCoordCount;

        renderLista();
      }

      /* ============================================================
       RENDER LISTA
    ============================================================ */

      function renderLista() {
        if (!camarasGeoJSON) {
          return;
        }

        const texto = (buscarInput.value || "")

          .toUpperCase()

          .trim();

        const estadoFiltro = filtroEstadoSelect.value || "TODAS";

        const filtradas = camarasGeoJSON.features.filter((f) => {
          const p = f.properties;

          const coincideTexto =
            (p.nombre || "")

              .toUpperCase()

              .includes(texto) ||
            (p.ubicacion || "")

              .toUpperCase()

              .includes(texto);

          let coincideEstado = true;

          if (estadoFiltro === "ONLINE") {
            coincideEstado = estaOnline(p.estado);
          }

          if (estadoFiltro === "CAIDA") {
            coincideEstado = !estaOnline(p.estado);
          }

          return coincideTexto && coincideEstado;
        });

        /* =============================
         LISTADO HTML
      ============================= */

        listaCamarasEl.innerHTML = filtradas

          .sort((a, b) =>
            a.properties.nombre.localeCompare(b.properties.nombre),
          )

          .map((f) => {
            const p = f.properties;

            const coord = f.geometry.coordinates;

            const online = estaOnline(p.estado);

            return `
  <div
    class="cam-item"
    data-nombre="${p.nombre}"
    data-lng="${coord[0]}"
    data-lat="${coord[1]}"
  >

                  <b>
                    ${p.nombre}
                  </b>


                  <div
                    class="cam-ubicacion"
                  >
                    ${p.ubicacion || "-"}
                  </div>


                  <div
                    class="cam-estado"

                    style="
                      color:
                      ${online ? "#22c55e" : "#ef4444"};
                    "
                  >

                    ${online ? "🟢 ONLINE" : "🔴 CAÍDA"}

                  </div>

                </div>

              `;
          })

          .join("");

        /* =============================
         CLICK LISTA
      ============================= */

        document.querySelectorAll(".cam-item").forEach((item) => {
          item.addEventListener("click", () => {
            const nombre = item.dataset.nombre;

            const feature = camarasGeoJSON.features.find(
              (f) => f.properties.nombre === nombre,
            );

            if (!feature) {
              return;
            }

            const coordenadas = feature.geometry.coordinates;

            map.flyTo({
              center: coordenadas,
              zoom: 17,
              duration: 800,
            });

            setTimeout(() => {
              abrirPopupCamara(feature);
            }, 850);
          });
        });
      }

      function aplicarFiltroMapa() {
        if (!map.getLayer("camaras-puntos")) {
          return;
        }

        const texto = (buscarInput.value || "").toUpperCase().trim();

        const estadoFiltro = filtroEstadoSelect.value || "TODAS";

        const filtros = [];

        // =============================
        // FILTRO TEXTO
        // =============================

        if (texto) {
          filtros.push([
            "any",

            ["in", texto, ["upcase", ["get", "nombre"]]],

            ["in", texto, ["upcase", ["get", "ubicacion"]]],
          ]);
        }

        // =============================
        // FILTRO ESTADO
        // =============================

        if (estadoFiltro === "ONLINE") {
          filtros.push([
            "match",
            ["get", "estado"],
            ["ONLINE", "ONLINE (HTTP)"],
            true,
            false,
          ]);
        }

        if (estadoFiltro === "CAIDA") {
          filtros.push([
            "!",
            [
              "match",
              ["get", "estado"],
              ["ONLINE", "ONLINE (HTTP)"],
              true,
              false,
            ],
          ]);
        }

        // =============================
        // APLICAR
        // =============================

        if (filtros.length === 0) {
          map.setFilter("camaras-puntos", null);
        } else if (filtros.length === 1) {
          map.setFilter("camaras-puntos", filtros[0]);
        } else {
          map.setFilter("camaras-puntos", ["all", ...filtros]);
        }
      }

      async function actualizarEstados() {
        try {
          const estadoActual = await fetch("/estado-actual").then((r) =>
            r.json(),
          );

          const mapaEstado = {};

          estadoActual.forEach((cam) => {
            const clave = extraerCodigo(cam.nombre);

            mapaEstado[clave] = cam;
          });

          let cambios = 0;

          camarasGeoJSON.features.forEach((feature) => {
            const clave = extraerCodigo(feature.properties.nombre);

            const nuevo = mapaEstado[clave];

            const nuevoEstado = nuevo?.estado || "SIN RESPUESTA";

            if (feature.properties.estado !== nuevoEstado) {
              cambios++;
            }

            feature.properties.estado = nuevoEstado;

            feature.properties.latencia = nuevo?.latencia || "-";

            feature.properties.fecha = nuevo?.fecha || "";
          });

          const source = map.getSource("camaras");

          if (source) {
            source.setData(camarasGeoJSON);
          }

          if (cambios > 0) {
            console.log("🔄 Estados actualizados:", cambios);
          } else {
            console.log("✅ Sin cambios en los estados");
          }

          actualizarPanel();

          aplicarFiltroMapa();
        } catch (err) {
          console.error("❌ Error actualizando estados:", err);
        }
      }
      /* ============================================================
       FILTROS PANEL
    ============================================================ */

      buscarInput.addEventListener("input", () => {
        renderLista();
        aplicarFiltroMapa();
      });

      filtroEstadoSelect.addEventListener("change", () => {
        renderLista();

        aplicarFiltroMapa();
      });

      /* ============================================================
       ULTIMOS DIAS
    ============================================================ */

      function obtenerUltimosDias(estados, cantidad = 7) {
        const entradas = Object.entries(estados || {});

        entradas.sort((a, b) => {
          const [da, ma, ya] = a[0].split("/");

          const [db, mb, yb] = b[0].split("/");

          const fechaA = new Date(`${ya}-${ma}-${da}`);

          const fechaB = new Date(`${yb}-${mb}-${db}`);

          return fechaA - fechaB;
        });

        return entradas.slice(-cantidad);
      }

      /* ============================================================
       UPTIME
    ============================================================ */

      function calcularUptime(estados, dias = 30) {
        const entradas = obtenerUltimosDias(estados, dias);

        if (!entradas.length) {
          return 0;
        }

        let online = 0;

        entradas.forEach(([fecha, estado]) => {
          if (estaOnline(estado)) {
            online++;
          }
        });

        return Math.round((online / entradas.length) * 100);
      }

      /* ============================================================
       DIAS DE CAIDA
    ============================================================ */

      function calcularCaida(estados, fechas) {
        let diasCaida = 0;

        for (let i = fechas.length - 1; i >= 0; i--) {
          const f = fechas[i];

          const estado = estados[f] || "";

          if (estado.includes("ONLINE")) {
            break;
          }

          diasCaida++;
        }

        return diasCaida;
      }
      function abrirPopupCamara(feature) {
        const p = feature.properties;

        const coordenadas = feature.geometry.coordinates.slice();

        const nombre = p.nombre || "-";

        const estado = p.estado || "SIN RESPUESTA";

        const ubicacion = p.ubicacion || "-";

        const proveedor = p.proveedor || "-";

        const ip = p.ip || "-";

        const online = estaOnline(estado);

        let estados = {};

        try {
          estados = JSON.parse(p.historial || "{}");
        } catch {
          estados = {};
        }

        const ultimos7 = obtenerUltimosDias(estados, 7);

        const uptime = calcularUptime(estados, 30);

        const diasCaida = calcularCaida(estados, historialData?.fechas || []);

        let circulos = "";

        ultimos7.forEach(([fecha, estadoDia]) => {
          const ok = estaOnline(estadoDia);

          circulos += `
        <div
          title="${fecha} - ${estadoDia}"
          style="
            width:18px;
            height:18px;
            border-radius:50%;
            background:${ok ? "#22c55e" : "#ef4444"};
            border:1.5px solid #111827;
          "
        ></div>
      `;
        });

        const html = `
    <div style="
      width:260px;
      font-family:Segoe UI,Arial,sans-serif;
      color:#111827;
    ">

      <div style="
        font-size:21px;
        font-weight:900;
        margin-bottom:3px;
      ">
        ${nombre}
      </div>

      <div style="
        color:#4b5563;
        font-size:13px;
        margin-bottom:10px;
      ">
        ${ubicacion}
      </div>

      <div style="
        background:${online ? "#dcfce7" : "#fee2e2"};
        color:${online ? "#166534" : "#991b1b"};
        padding:8px;
        border-radius:10px;
        text-align:center;
        font-weight:900;
        margin-bottom:10px;
      ">
        <span style="
          display:inline-block;
          width:12px;
          height:12px;
          border-radius:50%;
          background:${online ? "#22c55e" : "#ef4444"};
          border:1px solid #111;
          vertical-align:-1px;
          margin-right:4px;
        "></span>

        ${online ? "ONLINE" : "OFFLINE"}
      </div>

      <div style="
        font-size:13px;
        line-height:1.55;
      ">
        <div>
  <b>IP:</b>
  ${
    ip && ip !== "-"
      ? `
        <a
          href="http://${ip}"
          target="_blank"
          rel="noopener noreferrer"
          style="
            color:#2563eb;
            font-weight:800;
            text-decoration:none;
          "
        >
          ${ip}
        </a>
      `
      : "-"
  }
</div>

        <div>
          <b>Proveedor:</b> ${proveedor}
        </div>
      </div>

      ${
        !online
          ? `
            <div style="
              margin-top:10px;
              background:#650b0b;
              color:white;
              padding:8px 10px;
              border-radius:10px;
              font-weight:800;
            ">
              🔴 Caída hace ${diasCaida} día(s)
            </div>
          `
          : ""
      }

      <div style="
        height:1px;
        background:#e5e7eb;
        margin:10px 0;
      "></div>

      <div style="
        font-size:13px;
        font-weight:800;
        margin-bottom:8px;
      ">
        Últimos 7 días
      </div>

      <div style="
        display:flex;
        gap:9px;
        align-items:center;
        margin-bottom:10px;
      ">
        ${circulos || "Sin historial"}
      </div>

      <div style="
        background:#eff6ff;
        color:#2563eb;
        padding:9px;
        border-radius:10px;
        text-align:center;
        font-size:13px;
        font-weight:900;
        margin-bottom:10px;
      ">
        📈 Uptime 30 días: ${uptime}%
      </div>

      <button
        id="btn-centrar-popup"
        style="
          width:100%;
          border:0;
          background:#2563eb;
          color:white;
          padding:9px;
          border-radius:9px;
          font-weight:900;
          cursor:pointer;
          font-size:13px;
        "
      >
        📍 Centrar cámara
      </button>

    </div>
  `;

        const popup = new maplibregl.Popup({
          offset: 12,
          maxWidth: "300px",
        })
          .setLngLat(coordenadas)
          .setHTML(html)
          .addTo(map);

        const botonCentrar = popup
          .getElement()
          .querySelector("#btn-centrar-popup");

        botonCentrar?.addEventListener("click", () => {
          map.flyTo({
            center: coordenadas,
            zoom: 17,
            duration: 800,
          });
        });
      }
      function actualizarSelectorCoordenadas() {
        const seleccionActual = camaraEditSelect.value;

        const ordenadas = [...coordsData].sort((a, b) => {
          const latA = parseFloat(a.lat);
          const lngA = parseFloat(a.lng);
          const latB = parseFloat(b.lat);
          const lngB = parseFloat(b.lng);

          const aTieneCoord =
            !isNaN(latA) && !isNaN(lngA) && latA !== 0 && lngA !== 0;

          const bTieneCoord =
            !isNaN(latB) && !isNaN(lngB) && latB !== 0 && lngB !== 0;

          // Pendientes primero
          if (aTieneCoord !== bTieneCoord) {
            return aTieneCoord ? 1 : -1;
          }

          return a.nombre.localeCompare(b.nombre, "es", {
            numeric: true,
            sensitivity: "base",
          });
        });

        camaraEditSelect.innerHTML = "";

        let pendientes = 0;

        ordenadas.forEach((camara) => {
          const lat = parseFloat(camara.lat);
          const lng = parseFloat(camara.lng);

          const tieneCoord =
            !isNaN(lat) && !isNaN(lng) && lat !== 0 && lng !== 0;

          const option = document.createElement("option");
          option.value = camara.nombre;
          option.textContent = tieneCoord
            ? camara.nombre
            : `⚠ ${camara.nombre} — SIN COORDENADAS`;

          camaraEditSelect.appendChild(option);

          if (!tieneCoord) {
            pendientes++;
          }
        });

        // Mantener seleccionada la cámara con la que se estaba trabajando
        if (
          seleccionActual &&
          Array.from(camaraEditSelect.options).some(
            (option) => option.value === seleccionActual,
          )
        ) {
          camaraEditSelect.value = seleccionActual;
        }

        sinCoordCount = pendientes;
        sincoordEl.innerText = pendientes;

        contadorPendientes.innerText =
          pendientes > 0
            ? `(${pendientes} pendientes)`
            : "(sin pendientes)";
      }

      async function eliminarCoordenadaSeleccionada() {
        const nombre = camaraEditSelect.value;

        if (!nombre) {
          alert("Seleccioná una cámara");
          return;
        }

        const coord = coordsData.find((c) => c.nombre === nombre);
        const lat = parseFloat(coord?.lat);
        const lng = parseFloat(coord?.lng);
        const tieneCoord = !isNaN(lat) && !isNaN(lng) && lat !== 0 && lng !== 0;

        if (!tieneCoord) {
          alert("⚠️ Esa cámara ya está sin coordenadas.");
          return;
        }

        if (!confirm("¿Eliminar coordenada de:\n\n" + nombre + " ?")) return;

        try {
          const respuesta = await fetch("/api/coords/" + encodeURIComponent(nombre), {
            method: "DELETE",
          });

          if (!respuesta.ok) throw new Error("Error eliminando coordenada");

          coord.lat = 0;
          coord.lng = 0;

          camarasGeoJSON.features = camarasGeoJSON.features.filter(
            (f) => f.properties.nombre !== nombre,
          );

          map.getSource("camaras")?.setData(camarasGeoJSON);
          actualizarSelectorCoordenadas();
          actualizarPanel();
          aplicarFiltroMapa();

          alert("✅ Coordenada eliminada");
        } catch (err) {
          console.error("❌ Error eliminando coordenada:", err);
          alert("❌ Error eliminando coordenada");
        }
      }

      function activarEdicion() {
        const nombre = camaraEditSelect.value;

        if (!nombre) {
          alert("Seleccioná una cámara");
          return;
        }

        modoEdicion = true;

        map.getCanvas().style.cursor = "crosshair";

        alert("Ahora hacé click en la nueva ubicación de la cámara.");
      }
      /* ============================================================
       MAPA CARGADO
    ============================================================ */

      map.on("load", async () => {
        console.log("✅ MapLibre cargado correctamente");

        await cargarCamaras();

        const panelEl = document.getElementById("panel");
        const btnCerrarPanel = document.getElementById("btnCerrarPanel");
        const btnAbrirPanel = document.getElementById("btnAbrirPanel");
        const btnFullscreen = document.getElementById("btnFullscreen");

        btnCerrarPanel?.addEventListener("click", () => {
          panelEl.style.display = "none";
          btnAbrirPanel.style.display = "block";

          setTimeout(() => {
            map.resize();
          }, 100);
        });

        btnAbrirPanel?.addEventListener("click", () => {
          panelEl.style.display = "block";
          btnAbrirPanel.style.display = "none";

          setTimeout(() => {
            map.resize();
          }, 100);
        });

        btnFullscreen?.addEventListener("click", async () => {
          try {
            if (!document.fullscreenElement) {
              await document.documentElement.requestFullscreen();
            } else {
              await document.exitFullscreen();
            }

            setTimeout(() => {
              map.resize();
            }, 100);
          } catch (err) {
            console.error("Error fullscreen:", err);
          }
        });
        const btnActualizar = document.getElementById("btnActualizar");

        btnActualizar?.addEventListener("click", async () => {
          btnActualizar.disabled = true;
          btnActualizar.innerText = "Actualizando...";

          await actualizarEstados();

          btnActualizar.innerText = "🔄 Actualizar ahora";
          btnActualizar.disabled = false;
        });
        btnReubicar?.addEventListener("click", activarEdicion);
        btnEliminarCoord?.addEventListener("click", eliminarCoordenadaSeleccionada);
        /* ============================================================
           CLICK CAMARA / POPUP
        ============================================================ */

        map.on("click", "camaras-puntos", (e) => {
          if (modoEdicion) {
            return;
          }

          if (!e.features || !e.features.length) {
            return;
          }

          abrirPopupCamara(e.features[0]);
        });
        map.on("click", async (e) => {
          if (!modoEdicion) {
            return;
          }

          const nombre = camaraEditSelect.value;

          const lat = e.lngLat.lat;

          const lng = e.lngLat.lng;

          try {
            const respuesta = await fetch("/api/coords", {
              method: "POST",

              headers: {
                "Content-Type": "application/json",
              },

              body: JSON.stringify({
                nombre,
                lat,
                lng,
              }),
            });

            if (!respuesta.ok) {
              throw new Error("Error actualizando coordenada");
            }

            // =============================
            // ACTUALIZAR ESTE MAPA
            // =============================
            let feature = camarasGeoJSON.features.find(
              (f) => f.properties.nombre === nombre,
            );

            if (feature) {
              feature.geometry.coordinates = [lng, lat];
            } else {
              const estadoActual = await fetch("/estado-actual").then((r) => r.json());
              const datosEstado = estadoActual.find(
                (c) => extraerCodigo(c.nombre) === extraerCodigo(nombre),
              );
              const historialCam = historialData?.camaras?.[normalizarNombre(nombre)];

              feature = {
                type: "Feature",
                geometry: { type: "Point", coordinates: [lng, lat] },
                properties: {
                  nombre,
                  estado: datosEstado?.estado || "SIN RESPUESTA",
                  latencia: datosEstado?.latencia || "-",
                  fecha: datosEstado?.fecha || "",
                  proveedor: historialCam?.info?.proveedor || "-",
                  ubicacion: historialCam?.info?.ubicacion || "-",
                  ip: historialCam?.info?.ip || "-",
                  historial: JSON.stringify(historialCam?.estados || {}),
                },
              };

              camarasGeoJSON.features.push(feature);
            }

            const coordLocal = coordsData.find((c) => c.nombre === nombre);
            if (coordLocal) {
              coordLocal.lat = lat;
              coordLocal.lng = lng;
            }

            map.getSource("camaras")?.setData(camarasGeoJSON);
            actualizarSelectorCoordenadas();
            actualizarPanel();
            aplicarFiltroMapa();

            modoEdicion = false;

            map.getCanvas().style.cursor = "";

            alert("✅ Coordenada actualizada");
          } catch (err) {
            console.error(err);

            modoEdicion = false;

            map.getCanvas().style.cursor = "";

            alert("❌ Error actualizando coordenada");
          }
        });

        /* ============================================================
           CURSOR CAMARAS
        ============================================================ */

        map.on("mouseenter", "camaras-puntos", () => {
          map.getCanvas().style.cursor = "pointer";
        });

        map.on("mouseleave", "camaras-puntos", () => {
          map.getCanvas().style.cursor = "";
        });

        /* ============================================================
           AUTO REFRESH ESTADOS
        ============================================================ */

        console.log("🔄 Autoactualización iniciada cada 10 segundos");
        setInterval(actualizarEstados, 10000);
      });

      /* ============================================================
         ERRORES MAPLIBRE
      ============================================================ */

      map.on("error", (e) => {
        console.error("❌ Error MapLibre:", e.error || e);
      });
    </script>
  </body>
</html>
